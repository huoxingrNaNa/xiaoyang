<!-- FUN-STATS-START -->
<style>
#egg-stats{position:fixed;left:14px;bottom:14px;z-index:61;display:flex;align-items:center;gap:8px;
  padding:5px 11px;border-radius:999px;background:rgba(12,20,30,.45);color:#eaf6ff;cursor:pointer;
  font:12px/1.35 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;user-select:none;
  opacity:.55;transition:opacity .35s,background .35s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  max-width:72vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#egg-stats:hover,#egg-stats:active{opacity:1;background:rgba(12,20,30,.8)}
#egg-stats b{color:#8ef07a;font-weight:800}
#egg-stats .dv{color:#fcfc54;font-weight:700}
#egg-stats .sep{opacity:.35}
#egg-stats .fb b{color:#ffd479}
#egg-stats em{font-style:normal;opacity:.65;font-size:10px;margin-left:1px}
#egg-stats[hidden]{display:none}

#egg-sp{position:fixed;inset:0;z-index:9998;display:none;align-items:center;justify-content:center;
  background:rgba(4,10,18,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#egg-sp.on{display:flex}
.egg-card{position:relative;width:min(420px,92vw);max-height:86vh;overflow:auto;padding:16px;
  background:rgba(18,26,38,.97);color:#eaf6ff;border:2px solid rgba(255,255,255,.16);border-radius:14px;
  box-shadow:0 24px 60px rgba(0,0,0,.5);
  font:13px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.egg-card h3{font-size:15px;margin:0 0 2px}
.egg-card .sub{font-size:11px;opacity:.6}
.egg-card .egg-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.1)}
.egg-card .egg-row b{font-size:15px;font-variant-numeric:tabular-nums;color:#8ef07a}
.egg-card .egg-sec{font-size:12px;letter-spacing:.5px;opacity:.72;margin:14px 0 2px}
.egg-card .rank{display:flex;align-items:center;gap:8px;margin:7px 0}
.egg-card .rank .nm{width:88px;flex:0 0 auto;font-size:12px;white-space:nowrap}
.egg-card .rank .bar{flex:1 1 auto;height:10px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
.egg-card .rank .bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#3c8527,#8ef07a);
  transition:width .5s ease}
.egg-card .rank .vv{width:52px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;opacity:.9}
.egg-card .days{display:flex;align-items:flex-end;gap:5px;height:86px;margin-top:8px}
.egg-card .days .d{flex:1 1 auto;height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;gap:3px}
.egg-card .days .d i{width:100%;border-radius:3px 3px 0 0;min-height:2px;
  background:linear-gradient(180deg,#8ef07a,#3c8527)}
.egg-card .days .d span{font-size:9px;opacity:.6;line-height:1}
.egg-card .egg-close{position:absolute;top:8px;right:10px;width:28px;height:28px;border-radius:50%;
  border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#eaf6ff;
  font:700 15px/1 sans-serif;cursor:pointer;display:grid;place-items:center}
.egg-card .egg-close:hover{background:rgba(255,255,255,.18)}
@media (max-width:520px){
  #egg-stats{font-size:11px;padding:4px 9px;gap:6px;max-width:66vw}
  .egg-card .rank .nm{width:76px}
}
</style>
<span id="egg-stats" role="button" tabindex="0" hidden title="本站访问统计（点击看排行榜）"><span class="ab">👀 <b id="egg-pv">–</b> <span class="dv" id="egg-dy"></span></span><span class="fb" hidden>👀 <b id="busuanzi_value_site_pv">–</b><em>※</em></span><span class="sep">|</span><span class="ab">🧍 <b id="egg-uv">–</b></span><span class="fb" hidden>🧍 <b id="busuanzi_value_site_uv">–</b><em>※</em></span></span>
<script>
(function () {
  var API = 'https://abacus.jasoncameron.dev/';
  var NS = 'xiaoyang-site/';
  var box = document.getElementById('egg-stats');
  if (!box) return;
  var pvEl = document.getElementById('egg-pv');
  var uvEl = document.getElementById('egg-uv');
  var dyEl = document.getElementById('egg-dy');

  var path = (location.pathname || '').toLowerCase();
  var page = path.indexOf('works') >= 0 ? 'works' : (path.indexOf('game') >= 0 ? 'game' : 'index');
  var PAGE_NAME = { index: '首页', works: '作品页', game: '方块工坊' };

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function ymd(d) { return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
  function dash(s) { return s.slice(0, 4) + '-' + s.slice(4, 6) + '-' + s.slice(6, 8); }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function el(id) { return document.getElementById(id); }
  function set(id, v) { var e = el(id); if (e) e.textContent = v; }
  function cget(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function cset(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  function ask(p, ms) {
    if (!window.fetch) return Promise.reject(new Error('no fetch'));
    var ctl = window.AbortController ? new AbortController() : null;
    var t = setTimeout(function () { if (ctl) ctl.abort(); }, ms || 6000);
    return fetch(API + p, { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.json(); })
      .then(function (j) { clearTimeout(t); return j; })
      .catch(function (e) { clearTimeout(t); throw e; });
  }
  function num(j) { return (j && typeof j.value === 'number') ? j.value : null; }

  /* 统一按北京时间（UTC+8）分桶：不然海外访客会把同一天拆到不同日期键 */
  function ymdCN(ts) {
    var t = new Date(ts + 8 * 3600000);
    return t.getUTCFullYear() + pad(t.getUTCMonth() + 1) + pad(t.getUTCDate());
  }
  var today = ymdCN(Date.now());
  var snap = cget('xy_snap') || {};

  /* ---------- 徽章 ---------- */
  function badge() {
    pvEl.textContent = (typeof snap.pv === 'number') ? fmt(snap.pv) : '–';
    uvEl.textContent = (typeof snap.uv === 'number') ? fmt(snap.uv) : '–';
    dyEl.textContent = (typeof snap.dy === 'number') ? ('今日 +' + fmt(snap.dy)) : '';
    box.hidden = false;
    box.setAttribute('title', '本站累计浏览 ' + pvEl.textContent + ' 次 · 今日新增 ' +
      (typeof snap.dy === 'number' ? snap.dy : '?') + ' · 独立访客 ' + uvEl.textContent +
      ' 位 —— 点击看排行榜');
  }
  if (typeof snap.pv === 'number' || typeof snap.uv === 'number') badge();

  /* ---------- 每次打开页面：记账 ---------- */
  var seen = false, daySeen = false;
  try { seen = !!localStorage.getItem('xy_seen'); } catch (e) {}
  try { daySeen = localStorage.getItem('xy_day') === today; } catch (e) {}

  var okCount = 0, failCount = 0, fbActive = false;

  function account(path, apply) {
    return ask(path).then(function (j) {
      var v = num(j);
      if (v === null) throw new Error('empty');
      apply(v);
      okCount++;
    }).catch(function () { failCount++; });
  }

  var jobs = [];
  jobs.push(account('hit/' + NS + 'hits', function (v) { snap.pv = v; }));
  jobs.push(account('hit/' + NS + 'd-' + today, function (v) { snap.dy = v; }));
  jobs.push(account('hit/' + NS + 'p-' + page, function (v) { snap['p-' + page] = v; }));
  jobs.push(account((seen ? 'get/' : 'hit/') + NS + 'visitors', function (v) {
    snap.uv = v;
    try { localStorage.setItem('xy_seen', '1'); } catch (e) {}
  }));
  jobs.push(account((daySeen ? 'get/' : 'hit/') + NS + 'u-' + today, function (v) {
    snap.du = v;
    try { localStorage.setItem('xy_day', today); } catch (e) {}
  }));
  Promise.all(jobs).then(function () {
    cset('xy_snap', snap);
    if (okCount === 0) fallback(); else badge();
  });

  /* ---------- 备用计数源（busuanzi）：主源不可达时顶上 ---------- */
  var SRC_OK = '数据来自 abacus 计数器 · 只记数字，不收集任何个人信息';
  var SRC_FB = '⚠️ 主计数源（abacus）不可达，当前显示备用源 busuanzi 的累计数；今日新增 / 排行榜需要主源，暂时不可用';

  function swapToFallback() {
    var abs = box.querySelectorAll('.ab'), fbs = box.querySelectorAll('.fb'), i;
    for (i = 0; i < abs.length; i++) abs[i].hidden = true;
    for (i = 0; i < fbs.length; i++) fbs[i].hidden = false;
    box.hidden = false;
    box.setAttribute('title', '主计数源不可达，当前显示备用源 busuanzi 的累计数（※）—— 点开看详情');
  }

  function fallback() {
    if (fbActive) return;
    fbActive = true;
    swapToFallback();
    if (!document.getElementById('egg-bsz-js')) {
      var sc = document.createElement('script');
      sc.id = 'egg-bsz-js';
      sc.async = true;
      sc.src = 'https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js';
      document.head.appendChild(sc);
    }
    /* busuanzi 会把数字写进 #busuanzi_value_* 元素，轮询等它填好 */
    var tries = 0;
    var t = setInterval(function () {
      tries++;
      var a = el('busuanzi_value_site_pv'), b = el('busuanzi_value_site_uv');
      var okA = !!(a && /\d/.test(a.textContent || ''));
      var okB = !!(b && /\d/.test(b.textContent || ''));
      if (okA || okB) { clearInterval(t); return; }
      if (tries > 25) { clearInterval(t); if (!okA && !okB) box.hidden = true; }
    }, 400);
  }

  /* ---------- 统计面板 ---------- */
  var sp = null;
  function lastDays(n) {
    var out = [], base = Date.now();
    for (var i = n - 1; i >= 0; i--) out.push(ymdCN(base - i * 86400000));
    return out;
  }
  function build() {
    if (sp) return sp;
    sp = document.createElement('div');
    sp.id = 'egg-sp';
    sp.innerHTML = '<div class="egg-card" role="dialog" aria-label="访问统计">' +
      '<button class="egg-close" type="button" aria-label="关闭">×</button>' +
      '<h3>📊 访问统计</h3>' +
      '<div class="sub" id="egg-c-src">数据来自 abacus 计数器 · 只记数字，不收集任何个人信息</div>' +
      '<div class="egg-row" style="margin-top:10px"><span>👀 累计浏览</span><b id="egg-c-pv">–</b></div>' +
      '<div class="egg-row"><span>📈 今日新增</span><b id="egg-c-dy">–</b></div>' +
      '<div class="egg-row"><span>🧍 独立访客</span><b id="egg-c-uv">–</b></div>' +
      '<div class="egg-row"><span>🌙 今日访客</span><b id="egg-c-du">–</b></div>' +
      '<div class="egg-sec">🏆 页面热度榜</div><div id="egg-c-pages"></div>' +
      '<div class="egg-sec">📅 最近 7 天</div><div class="days" id="egg-c-days"></div>' +
      '<div class="sub" id="egg-c-best" style="margin-top:8px"></div>' +
      '</div>';
    document.body.appendChild(sp);
    sp.addEventListener('click', function (e) { if (e.target === sp) close(); });
    var b = sp.querySelector('.egg-close');
    if (b) b.addEventListener('click', close);
    return sp;
  }
  function close() { if (sp) sp.classList.remove('on'); }

  function render(days) {
    set('egg-c-pv', (typeof snap.pv === 'number') ? fmt(snap.pv) : '–');
    set('egg-c-dy', (typeof snap.dy === 'number') ? ('+' + fmt(snap.dy)) : '–');
    set('egg-c-uv', (typeof snap.uv === 'number') ? fmt(snap.uv) : '–');
    set('egg-c-du', (typeof snap.du === 'number') ? fmt(snap.du) : '–');

    var rows = [['首页', snap['p-index']], ['作品页', snap['p-works']], ['方块工坊', snap['p-game']]];
    var max = 1, i;
    for (i = 0; i < rows.length; i++) max = Math.max(max, rows[i][1] || 0);
    rows.sort(function (a, b) { return (b[1] || 0) - (a[1] || 0); });
    var medal = ['🥇', '🥈', '🥉'], html = '';
    for (i = 0; i < rows.length; i++) {
      var v = rows[i][1] || 0;
      html += '<div class="rank"><span class="nm">' + medal[i] + ' ' + rows[i][0] + '</span>' +
        '<span class="bar"><i style="width:' + (v / max * 100).toFixed(1) + '%"></i></span>' +
        '<span class="vv">' + fmt(v) + '</span></div>';
    }
    var pe = el('egg-c-pages'); if (pe) pe.innerHTML = html;

    var dv = [], dmax = 1, best = null;
    for (i = 0; i < days.length; i++) {
      var val = snap['d-' + days[i]] || 0;
      dv.push({ d: days[i], v: val });
      dmax = Math.max(dmax, val);
    }
    var dh = '';
    for (i = 0; i < dv.length; i++) {
      var x = dv[i];
      if (!best || x.v > best.v) best = x;
      var h = x.v ? Math.max(5, Math.round(x.v / dmax * 56)) : 2;
      dh += '<div class="d" title="' + dash(x.d) + '：' + x.v + ' 次"><span>' + x.v + '</span>' +
        '<i style="height:' + h + 'px"></i><span>' + x.d.slice(6, 8) + '</span></div>';
    }
    var de = el('egg-c-days'); if (de) de.innerHTML = dh;
    set('egg-c-best', (best && best.v) ? ('最近 7 天最高：' + dash(best.d) + '（' + best.v + ' 次）')
      : '最近 7 天暂无数据');
    set('egg-c-src', fbActive ? SRC_FB : SRC_OK);
  }

  function refresh(days) {
    var keys = ['index', 'works', 'game'], reqs = [], i;
    for (i = 0; i < keys.length; i++) {
      (function (k) {
        reqs.push(ask('get/' + NS + 'p-' + k).then(function (j) {
          var v = num(j); if (v !== null) snap['p-' + k] = v;
        }).catch(function () {}));
      })(keys[i]);
    }
    for (i = 0; i < days.length; i++) {
      (function (d) {
        reqs.push(ask('get/' + NS + 'd-' + d).then(function (j) {
          var v = num(j); if (v !== null) snap['d-' + d] = v;
        }).catch(function () {}));
      })(days[i]);
    }
    return Promise.all(reqs).then(function () { cset('xy_snap', snap); render(days); });
  }

  function open() {
    build().classList.add('on');
    var days = lastDays(7);
    render(days);
    refresh(days);
  }

  box.addEventListener('click', function (e) { e.stopPropagation(); open(); });
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
})();
</script>
<!-- FUN-STATS-END -->
