name: 自动更新作品数据

on:
  schedule:
    # 北京时间 00:40（= UTC 16:40）—— 刚过零点就刷新，避免整个上午显示「昨天」
    - cron: '40 16 * * *'
    # 北京时间 12:40（= UTC 04:40）—— 中午再刷一次，保证数据新鲜
    - cron: '40 4 * * *'
  workflow_dispatch:

# 备注：GitHub 对定时任务可能排队延后（实测晚 5 小时左右，官方不保证准点）。
#       因此页面上的日期已改成「X 小时前」相对显示，即使延后也不会显得过期。

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉取 B 站数据并更新页面
        run: python3 refresh.py --local-only

      - name: 有变化就提交
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo '数据无变化，跳过提交'
          else
            git add -A
            git commit -m 'chore: 自动更新作品数据'
            git push
          fi