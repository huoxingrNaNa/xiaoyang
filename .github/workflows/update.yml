name: 自动更新作品数据

on:
  schedule:
    # 每天 UTC 02:20 = 北京时间 10:20
    - cron: '20 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉取 B 站数据并更新页面
        run: python3 refresh.py --local-only

      - name: 有变化就提交
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo '数据无变化，跳过提交'
          else
            git add -A
            git commit -m 'chore: 自动更新作品数据'
            git push
          fi