<script>
(function () {
  var reduce = false;
  try { reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  /* ---------- 音效：全部 WebAudio 合成，零外部文件 ---------- */
  var AC = null;
  function ac() {
    if (AC) return AC;
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    try { AC = new C(); } catch (e) { AC = null; }
    return AC;
  }
  function noise(dur, freq, q, vol) {
    var c = ac(); if (!c) return;
    var n = Math.max(1, Math.floor(c.sampleRate * dur));
    var b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = c.createBufferSource(); s.buffer = b;
    var f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    var g = c.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start();
  }
  function tone(freq, delay, dur, vol, type) {
    var c = ac(); if (!c) return;
    var t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.06);
  }
  function sfxDig() { noise(0.12, 620, 1.1, 0.14); }
  function sfxGet() { tone(784, 0, 0.22, 0.1, 'triangle'); tone(1175, 0.1, 0.3, 0.1, 'triangle'); }
  function sfxGem() { tone(1568, 0, 0.1, 0.08, 'square'); }

  /* ---------- 成就弹窗 ---------- */
  var STORE = 'xy_eggs_v1', got = {};
  try { got = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { got = {}; }
  var wrap = document.getElementById('egg-ach-wrap');

  function ach(id, name, icon) {
    if (got[id] || !wrap) return;
    got[id] = 1;
    try { localStorage.setItem(STORE, JSON.stringify(got)); } catch (e) {}
    if (AC) sfxGet();
    var d = document.createElement('div');
    d.className = 'egg-ach';
    var ic = document.createElement('span'); ic.className = 'ic'; ic.textContent = icon;
    var tx = document.createElement('span');
    var t1 = document.createElement('span'); t1.className = 't'; t1.textContent = '成就达成！';
    var t2 = document.createElement('span'); t2.className = 'n'; t2.textContent = name;
    tx.appendChild(t1); tx.appendChild(document.createElement('br')); tx.appendChild(t2);
    d.appendChild(ic); d.appendChild(tx);
    wrap.appendChild(d);
    requestAnimationFrame(function () { d.className = 'egg-ach in'; });
    setTimeout(function () {
      d.className = 'egg-ach';
      setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 520);
    }, 4200);
  }

  /* ---------- 挖方块：粒子 + 音效 ---------- */
  var COLORS = ['#7cbf5a', '#5d9a3d', '#8b5a34', '#a9713f'];
  function gone(el, ms) { setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, ms); }
  function digFx(x, y) {
    if (reduce) return;
    for (var i = 0; i < 8; i++) {
      var p = document.createElement('i');
      p.className = 'egg-bit';
      p.style.left = x + 'px'; p.style.top = y + 'px';
      var a = Math.random() * Math.PI * 2, r = 16 + Math.random() * 28;
      p.style.setProperty('--dx', (Math.cos(a) * r).toFixed(1) + 'px');
      p.style.setProperty('--dy', (Math.sin(a) * r + 16).toFixed(1) + 'px');
      p.style.background = COLORS[i % COLORS.length];
      document.body.appendChild(p);
      gone(p, 950);
    }
  }

  /* ---------- 钻石雨 ---------- */
  var GEMS = ['💎', '💎', '⭐', '🟩'];
  function gemRain() {
    if (AC) sfxGem();
    if (reduce) return;
    for (var i = 0; i < 34; i++) {
      var s = document.createElement('div');
      s.className = 'egg-gem';
      s.textContent = GEMS[Math.floor(Math.random() * GEMS.length)];
      s.style.left = (Math.random() * 98).toFixed(1) + 'vw';
      s.style.animationDelay = (Math.random() * 1.4).toFixed(2) + 's';
      s.style.animationDuration = (2.2 + Math.random() * 1.8).toFixed(2) + 's';
      document.body.appendChild(s);
      gone(s, 5800);
    }
  }

  /* ---------- F3 调试屏 ---------- */
  var f3 = document.getElementById('egg-f3');
  var f3on = false, rafId = 0, frames = 0, lastT = 0, fps = 0, mx = 0;

  function lines() {
    var px = mx / 4, py = 64 + Math.sin(Date.now() / 4000) * 8, pz = -window.pageYOffset / 8;
    var day = Math.floor(Date.now() / 86400000) % 365 + 1;
    return [
      '<b>xiao小小阳</b> · Minecraft 1.20.1 (Java Edition)',
      'FPS: ' + (fps || '--'),
      'XYZ: ' + px.toFixed(1) + ' / ' + py.toFixed(1) + ' / ' + pz.toFixed(1),
      'Block: ' + Math.floor(px) + ' ' + Math.floor(py) + ' ' + Math.floor(pz),
      'Biome: minecraft:plains',
      'Light: 15 (15 sky, 0 block)',
      'Day: ' + day + ' · ' + new Date().toTimeString().slice(0, 8),
      'Dimension: minecraft:overworld',

  document.addEventListener('touchstart', function () {

  }, { passive: true });
  document.addEventListener('click', function (e) {
    var c = ac(); if (c && c.state === 'suspended') { try { c.resume(); } catch (e) {} }
    var t = e.target;
    if (t && t.closest && t.closest('a,button,#egg-hint,#egg-mus,#egg-stats,#egg-sp,.egg-ach')) {

<span id="egg-mus" role="button" tabindex="0" title="背景音乐（C418 风格，点击开/关）" aria-label="背景音乐">🔇</span>
<script>
(function () {
  var btn = document.getElementById('egg-mus');
  var MUS = { on: false, timer: 0, master: null, gate: null, conv: null };
  /* A 小调五声音阶 —— C418 那种稀疏、随机的钢琴感 */
  var SCALE = [220.00, 261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99];

  function ac() { return window.xyAC ? window.xyAC() : null; }

  function build() {
    var c = ac(); if (!c) return null;
    if (MUS.gate) return c;
    var master = c.createGain();
    master.gain.value = 0.0;
    master.connect(c.destination);
    /* 用噪声脉冲响应做一个廉价混响，营造洞穴空间感 */
    var conv = c.createConvolver();
    var len = Math.floor(c.sampleRate * 2.8);
    var imp = c.createBuffer(2, len, c.sampleRate);
    for (var ch = 0; ch < 2; ch++) {
      var d = imp.getChannelData(ch);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8);
    }
    conv.buffer = imp;
    var wet = c.createGain(); wet.gain.value = 0.5;
    var gate = c.createGain(); gate.gain.value = 1;
    gate.connect(master);
    gate.connect(conv); conv.connect(wet); wet.connect(master);
    MUS.gate = gate; MUS.master = master; MUS.conv = conv;
    return c;
  }

  function note(freq, delay, dur, vol) {
    var c = ac(); if (!c || !MUS.gate) return;
    var t = c.currentTime + delay;
    var o = c.createOscillator(); o.type = 'triangle'; o.frequency.value = freq;
    var o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2.005;
    var g = c.createGain(), g2 = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(vol * 0.22, t + 0.01);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.55);
    o.connect(g); o2.connect(g2); g.connect(MUS.gate); g2.connect(MUS.gate);
    o.start(t); o.stop(t + dur + 0.1); o2.start(t); o2.stop(t + dur * 0.6 + 0.1);
  }

  function step() {
    if (!MUS.on) return;
    if (Math.random() < 0.18) note(SCALE[Math.floor(Math.random() * 3)] / 2, 0, 4.5, 0.05);
    note(SCALE[Math.floor(Math.random() * SCALE.length)], 0, 2.4 + Math.random() * 1.6, 0.075);
    if (Math.random() < 0.35) note(SCALE[Math.floor(Math.random() * SCALE.length)], 0.9, 1.8, 0.05);
    MUS.timer = setTimeout(step, 2200 + Math.random() * 4200);
  }

  function paint() {
    if (!btn) return;
    btn.textContent = MUS.on ? '🎵' : '🔇';
    btn.className = MUS.on ? 'on' : '';
    btn.setAttribute('title', MUS.on ? '背景音乐：开（点击关闭）' : '背景音乐：关（点击开启）');
  }

  function toggle(on) {
    var c = ac(); if (!c) return false;
    if (!MUS.gate && !build()) return false;
    if (c.state === 'suspended') { try { c.resume(); } catch (e) {} }
    MUS.on = (typeof on === 'boolean') ? on : !MUS.on;
    try {
      MUS.master.gain.cancelScheduledValues(c.currentTime);
      MUS.master.gain.setTargetAtTime(MUS.on ? 0.9 : 0.0, c.currentTime, 0.7);
    } catch (e) {}
    if (MUS.on) {
      if (window.xyAch) window.xyAch('musician', '音乐家 —— 打开了背景音乐', '🎵');
      if (!MUS.timer) step();
    } else {
      clearTimeout(MUS.timer); MUS.timer = 0;
    }
    try { localStorage.setItem('xy_music', MUS.on ? '1' : '0'); } catch (e) {}
    paint();
    return MUS.on;
  }

  if (btn) {
    if (localStorage.getItem('xy_music') === '0') { /* 上次关着，保持默认 */ }
    btn.addEventListener('click', function (e) { e.stopPropagation(); toggle(); });
    btn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
    var silent = false;
    try { silent = localStorage.getItem('xy_music') === '0'; } catch (e) {}
    if (!silent) {
      btn.className = 'tip';
      setTimeout(function () { if (!MUS.on) btn.className = ''; }, 9000);
    }
  }

  /* 上次开着的话，用户第一次交互时自动续上 */
  var want = false;
  try { want = localStorage.getItem('xy_music') === '1'; } catch (e) {}
  if (want) {
    var kick = function (e) {
      if (e && e.target === btn) return;
      if (toggle(true)) {
        document.removeEventListener('click', kick, true);
        document.removeEventListener('touchstart', kick, true);
      }
    };
    document.addEventListener('click', kick, true);
    document.addEventListener('touchstart', kick, true);
  }

  window.xyMusic = { toggle: toggle, on: function () { return MUS.on; } };
})();
</script>

<span id="egg-stats" role="button" tabindex="0" hidden title="本站访问统计（点击看排行榜）"><span class="ab">👀 <b id="egg-pv">–</b> <span class="dv" id="egg-dy"></span></span><span class="fb" hidden>👀 <b id="busuanzi_value_site_pv">–</b><em>※</em></span><span class="sep">|</span><span class="ab">🧍 <b id="egg-uv">–</b></span><span class="fb" hidden>🧍 <b id="busuanzi_value_site_uv">–</b><em>※</em></span></span>
<script>
(function () {
  var API = 'https://abacus.jasoncameron.dev/';
  var NS = 'xiaoyang-site/';
  var box = document.getElementById('egg-stats');
  if (!box) return;
  var pvEl = document.getElementById('egg-pv');
  var uvEl = document.getElementById('egg-uv');
  var dyEl = document.getElementById('egg-dy');

  var path = (location.pathname || '').toLowerCase();
  var page = path.indexOf('works') >= 0 ? 'works' : (path.indexOf('game') >= 0 ? 'game' : 'index');
  var PAGE_NAME = { index: '首页', works: '作品页', game: '方块工坊' };

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function ymd(d) { return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
  function dash(s) { return s.slice(0, 4) + '-' + s.slice(4, 6) + '-' + s.slice(6, 8); }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function el(id) { return document.getElementById(id); }
  function set(id, v) { var e = el(id); if (e) e.textContent = v; }
  function cget(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function cset(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  function ask(p, ms) {
    if (!window.fetch) return Promise.reject(new Error('no fetch'));
    var ctl = window.AbortController ? new AbortController() : null;
    var t = setTimeout(function () { if (ctl) ctl.abort(); }, ms || 6000);
    return fetch(API + p, { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.json(); })
      .then(function (j) { clearTimeout(t); return j; })
      .catch(function (e) { clearTimeout(t); throw e; });
  }
  function num(j) { return (j && typeof j.value === 'number') ? j.value : null; }

  /* 统一按北京时间（UTC+8）分桶：不然海外访客会把同一天拆到不同日期键 */
  function ymdCN(ts) {
    var t = new Date(ts + 8 * 3600000);
    return t.getUTCFullYear() + pad(t.getUTCMonth() + 1) + pad(t.getUTCDate());
  }
  var today = ymdCN(Date.now());
  var snap = cget('xy_snap') || {};

  /* ---------- 徽章 ---------- */
  function badge() {
    pvEl.textContent = (typeof snap.pv === 'number') ? fmt(snap.pv) : '–';
    uvEl.textContent = (typeof snap.uv === 'number') ? fmt(snap.uv) : '–';
    dyEl.textContent = (typeof snap.dy === 'number') ? ('今日 +' + fmt(snap.dy)) : '';
    box.hidden = false;
    box.setAttribute('title', '本站累计浏览 ' + pvEl.textContent + ' 次 · 今日新增 ' +
      (typeof snap.dy === 'number' ? snap.dy : '?') + ' · 独立访客 ' + uvEl.textContent +
      ' 位 —— 点击看排行榜');
  }
  if (typeof snap.pv === 'number' || typeof snap.uv === 'number') badge();

  /* ---------- 每次打开页面：记账 ---------- */
  var seen = false, daySeen = false;
  try { seen = !!localStorage.getItem('xy_seen'); } catch (e) {}
  try { daySeen = localStorage.getItem('xy_day') === today; } catch (e) {}

  var okCount = 0, failCount = 0, fbActive = false;

  function account(path, apply) {
    return ask(path).then(function (j) {
      var v = num(j);
      if (v === null) throw new Error('empty');
      apply(v);
      okCount++;
    }).catch(function () { failCount++; });
  }

  var jobs = [];
  jobs.push(account('hit/' + NS + 'hits', function (v) { snap.pv = v; }));
  jobs.push(account('hit/' + NS + 'd-' + today, function (v) { snap.dy = v; }));
  jobs.push(account('hit/' + NS + 'p-' + page, function (v) { snap['p-' + page] = v; }));
  jobs.push(account((seen ? 'get/' : 'hit/') + NS + 'visitors', function (v) {
    snap.uv = v;
    try { localStorage.setItem('xy_seen', '1'); } catch (e) {}
  }));
  jobs.push(account((daySeen ? 'get/' : 'hit/') + NS + 'u-' + today, function (v) {
    snap.du = v;
    try { localStorage.setItem('xy_day', today); } catch (e) {}
  }));
  Promise.all(jobs).then(function () {
    cset('xy_snap', snap);
    if (okCount === 0) fallback(); else badge();
  });

  /* ---------- 备用计数源（busuanzi）：主源不可达时顶上 ---------- */
  var SRC_OK = '数据来自 abacus 计数器 · 只记数字，不收集任何个人信息';
  var SRC_FB = '⚠️ 主计数源（abacus）不可达，当前显示备用源 busuanzi 的累计数；今日新增 / 排行榜需要主源，暂时不可用';

  function swapToFallback() {
    var abs = box.querySelectorAll('.ab'), fbs = box.querySelectorAll('.fb'), i;
    for (i = 0; i < abs.length; i++) abs[i].hidden = true;
    for (i = 0; i < fbs.length; i++) fbs[i].hidden = false;
    box.hidden = false;
    box.setAttribute('title', '主计数源不可达，当前显示备用源 busuanzi 的累计数（※）—— 点开看详情');
  }

  function fallback() {
    if (fbActive) return;
    fbActive = true;
    swapToFallback();
    if (!document.getElementById('egg-bsz-js')) {
      var sc = document.createElement('script');
      sc.id = 'egg-bsz-js';
      sc.async = true;
      sc.src = 'https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js';
      document.head.appendChild(sc);
    }
    /* busuanzi 会把数字写进 #busuanzi_value_* 元素，轮询等它填好 */
    var tries = 0;
    var t = setInterval(function () {
      tries++;
      var a = el('busuanzi_value_site_pv'), b = el('busuanzi_value_site_uv');
      var okA = !!(a && /\d/.test(a.textContent || ''));
      var okB = !!(b && /\d/.test(b.textContent || ''));
      if (okA || okB) { clearInterval(t); return; }
      if (tries > 25) { clearInterval(t); if (!okA && !okB) box.hidden = true; }
    }, 400);
  }

  /* ---------- 统计面板 ---------- */
  var sp = null;
  function lastDays(n) {
    var out = [], base = Date.now();
    for (var i = n - 1; i >= 0; i--) out.push(ymdCN(base - i * 86400000));
    return out;
  }
  function build() {
    if (sp) return sp;
    sp = document.createElement('div');
    sp.id = 'egg-sp';
    sp.innerHTML = '<div class="egg-card" role="dialog" aria-label="访问统计">' +
      '<button class="egg-close" type="button" aria-label="关闭">×</button>' +
      '<h3>📊 访问统计</h3>' +
      '<div class="sub" id="egg-c-src">数据来自 abacus 计数器 · 只记数字，不收集任何个人信息</div>' +
      '<div class="egg-row" style="margin-top:10px"><span>👀 累计浏览</span><b id="egg-c-pv">–</b></div>' +
      '<div class="egg-row"><span>📈 今日新增</span><b id="egg-c-dy">–</b></div>' +
      '<div class="egg-row"><span>🧍 独立访客</span><b id="egg-c-uv">–</b></div>' +
      '<div class="egg-row"><span>🌙 今日访客</span><b id="egg-c-du">–</b></div>' +
      '<div class="egg-sec">🏆 页面热度榜</div><div id="egg-c-pages"></div>' +
      '<div class="egg-sec">📅 最近 7 天</div><div class="days" id="egg-c-days"></div>' +
      '<div class="sub" id="egg-c-best" style="margin-top:8px"></div>' +
      '</div>';
    document.body.appendChild(sp);
    sp.addEventListener('click', function (e) { if (e.target === sp) close(); });
    var b = sp.querySelector('.egg-close');
    if (b) b.addEventListener('click', close);
    return sp;
  }
  function close() { if (sp) sp.classList.remove('on'); }

  function render(days) {
    set('egg-c-pv', (typeof snap.pv === 'number') ? fmt(snap.pv) : '–');
    set('egg-c-dy', (typeof snap.dy === 'number') ? ('+' + fmt(snap.dy)) : '–');
    set('egg-c-uv', (typeof snap.uv === 'number') ? fmt(snap.uv) : '–');
    set('egg-c-du', (typeof snap.du === 'number') ? fmt(snap.du) : '–');

    var rows = [['首页', snap['p-index']], ['作品页', snap['p-works']], ['方块工坊', snap['p-game']]];
    var max = 1, i;
    for (i = 0; i < rows.length; i++) max = Math.max(max, rows[i][1] || 0);
    rows.sort(function (a, b) { return (b[1] || 0) - (a[1] || 0); });
    var medal = ['🥇', '🥈', '🥉'], html = '';
    for (i = 0; i < rows.length; i++) {
      var v = rows[i][1] || 0;
      html += '<div class="rank"><span class="nm">' + medal[i] + ' ' + rows[i][0] + '</span>' +
        '<span class="bar"><i style="width:' + (v / max * 100).toFixed(1) + '%"></i></span>' +
        '<span class="vv">' + fmt(v) + '</span></div>';
    }
    var pe = el('egg-c-pages'); if (pe) pe.innerHTML = html;

    var dv = [], dmax = 1, best = null;
    for (i = 0; i < days.length; i++) {
      var val = snap['d-' + days[i]] || 0;
      dv.push({ d: days[i], v: val });
      dmax = Math.max(dmax, val);
    }
    var dh = '';
    for (i = 0; i < dv.length; i++) {
      var x = dv[i];
      if (!best || x.v > best.v) best = x;
      var h = x.v ? Math.max(5, Math.round(x.v / dmax * 56)) : 2;
      dh += '<div class="d" title="' + dash(x.d) + '：' + x.v + ' 次"><span>' + x.v + '</span>' +
        '<i style="height:' + h + 'px"></i><span>' + x.d.slice(6, 8) + '</span></div>';
    }
    var de = el('egg-c-days'); if (de) de.innerHTML = dh;
    set('egg-c-best', (best && best.v) ? ('最近 7 天最高：' + dash(best.d) + '（' + best.v + ' 次）')
      : '最近 7 天暂无数据');
    set('egg-c-src', fbActive ? SRC_FB : SRC_OK);
  }

  function refresh(days) {
    var keys = ['index', 'works', 'game'], reqs = [], i;
    for (i = 0; i < keys.length; i++) {
      (function (k) {
        reqs.push(ask('get/' + NS + 'p-' + k).then(function (j) {
          var v = num(j); if (v !== null) snap['p-' + k] = v;
        }).catch(function () {}));
      })(keys[i]);
    }
    for (i = 0; i < days.length; i++) {
      (function (d) {
        reqs.push(ask('get/' + NS + 'd-' + d).then(function (j) {
          var v = num(j); if (v !== null) snap['d-' + d] = v;
        }).catch(function () {}));
      })(days[i]);
    }
    return Promise.all(reqs).then(function () { cset('xy_snap', snap); render(days); });
  }

  function open() {
    build().classList.add('on');
    var days = lastDays(7);
    render(days);
    refresh(days);
  }

  box.addEventListener('click', function (e) { e.stopPropagation(); open(); });
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
})();
</script>
<!-- FUN-STATS-END -->
</body>
</html>
