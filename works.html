<script>
(function () {
  var reduce = false;
  try { reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  /* ---------- 音效：全部 WebAudio 合成，零外部文件 ---------- */
  var AC = null;
  function ac() {
    if (AC) return AC;
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    try { AC = new C(); } catch (e) { AC = null; }
    return AC;
  }
  function noise(dur, freq, q, vol) {
    var c = ac(); if (!c) return;
    var n = Math.max(1, Math.floor(c.sampleRate * dur));
    var b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = c.createBufferSource(); s.buffer = b;
    var f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    var g = c.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start();
  }
  function tone(freq, delay, dur, vol, type) {
    var c = ac(); if (!c) return;
    var t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.06);
  }
  function sfxDig() { noise(0.12, 620, 1.1, 0.14); }
  function sfxGet() { tone(784, 0, 0.22, 0.1, 'triangle'); tone(1175, 0.1, 0.3, 0.1, 'triangle'); }
  function sfxGem() { tone(1568, 0, 0.1, 0.08, 'square'); }

  /* ---------- 成就弹窗 ---------- */
  var STORE = 'xy_eggs_v1', got = {};
  try { got = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { got = {}; }
  var wrap = document.getElementById('egg-ach-wrap');

  function ach(id, name, icon) {
    if (got[id] || !wrap) return;
    got[id] = 1;
    try { localStorage.setItem(STORE, JSON.stringify(got)); } catch (e) {}
    if (AC) sfxGet();
    var d = document.createElement('div');
    d.className = 'egg-ach';
    var ic = document.createElement('span'); ic.className = 'ic'; ic.textContent = icon;
    var tx = document.createElement('span');
    var t1 = document.createElement('span'); t1.className = 't'; t1.textContent = '成就达成！';
    var t2 = document.createElement('span'); t2.className = 'n'; t2.textContent = name;
    tx.appendChild(t1); tx.appendChild(document.createElement('br')); tx.appendChild(t2);
    d.appendChild(ic); d.appendChild(tx);
    wrap.appendChild(d);
    requestAnimationFrame(function () { d.className = 'egg-ach in'; });
    setTimeout(function () {
      d.className = 'egg-ach';
      setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 520);
    }, 4200);
  }

  /* ---------- 挖方块：粒子 + 音效 ---------- */
  var COLORS = ['#7cbf5a', '#5d9a3d', '#8b5a34', '#a9713f'];
  function gone(el, ms) { setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, ms); }
  function digFx(x, y) {
    if (reduce) return;
    for (var i = 0; i < 8; i++) {
      var p = document.createElement('i');
      p.className = 'egg-bit';
      p.style.left = x + 'px'; p.style.top = y + 'px';
      var a = Math.random() * Math.PI * 2, r = 16 + Math.random() * 28;
      p.style.setProperty('--dx', (Math.cos(a) * r).toFixed(1) + 'px');
      p.style.setProperty('--dy', (Math.sin(a) * r + 16).toFixed(1) + 'px');
      p.style.background = COLORS[i % COLORS.length];
      document.body.appendChild(p);
      gone(p, 950);
    }
  }

  /* ---------- 钻石雨 ---------- */
  var GEMS = ['💎', '💎', '⭐', '🟩'];
  function gemRain() {
    if (AC) sfxGem();
    if (reduce) return;
    for (var i = 0; i < 34; i++) {
      var s = document.createElement('div');
      s.className = 'egg-gem';
      s.textContent = GEMS[Math.floor(Math.random() * GEMS.length)];
      s.style.left = (Math.random() * 98).toFixed(1) + 'vw';
      s.style.animationDelay = (Math.random() * 1.4).toFixed(2) + 's';
      s.style.animationDuration = (2.2 + Math.random() * 1.8).toFixed(2) + 's';
      document.body.appendChild(s);
      gone(s, 5800);
    }
  }

  /* ---------- F3 调试屏 ---------- */
  var f3 = document.getElementById('egg-f3');
  var f3on = false, rafId = 0, frames = 0, lastT = 0, fps = 0, mx = 0;

  function lines() {
    var px = mx / 4, py = 64 + Math.sin(Date.now() / 4000) * 8, pz = -window.pageYOffset / 8;
    var day = Math.floor(Date.now() / 86400000) % 365 + 1;
    return [
      '<b>xiao小小阳</b> · Minecraft 1.20.1 (Java Edition)',
      'FPS: ' + (fps || '--'),
      'XYZ: ' + px.toFixed(1) + ' / ' + py.toFixed(1) + ' / ' + pz.toFixed(1),
      'Block: ' + Math.floor(px) + ' ' + Math.floor(py) + ' ' + Math.floor(pz),
      'Biome: minecraft:plains',
      'Light: 15 (15 sky, 0 block)',
      'Day: ' + day + ' · ' + new Date().toTimeString().slice(0, 8),
      'Dimension: minecraft:overworld',
      'Local Difficulty: ' + (1 + (Date.now() % 100) / 100).toFixed(2),
      'Loaded Chunks: ' + document.querySelectorAll('*').length,
      'Entities: ' + document.querySelectorAll('.egg-gem').length + ' · Screen: ' + window.innerWidth + 'x' + window.innerHeight
    ].join('<br>');
  }
  function loop(t) {
    if (!f3on) { rafId = 0; return; }
    rafId = requestAnimationFrame(loop);
    frames++;
    if (lastT && t - lastT >= 500) { fps = Math.round(frames * 1000 / (t - lastT)); frames = 0; lastT = t; }
    if (f3) f3.innerHTML = lines();
  }
  function setF3(on) {
    if (!f3) return;
    f3on = (typeof on === 'boolean') ? on : !f3on;
    if (f3on) {
      f3.hidden = false; frames = 0; lastT = 0;
      if (!rafId) rafId = requestAnimationFrame(loop);
      ach('debug', '调试大师 —— 打开了 F3', '🔍');
    } else {
      f3.hidden = true;
    }
  }

  /* ---------- Konami 秘籍 ---------- */
  var KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
  var kpos = 0;
  function creative() {
    ach('creative', '创造模式 —— 你输对了秘籍', '💎');
    gemRain();
    if (reduce) return;
    var tip = document.createElement('div');
    tip.className = 'egg-tip';
    tip.textContent = '/gamemode creative';
    document.body.appendChild(tip);
    gone(tip, 1700);
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'F3') { e.preventDefault(); setF3(); return; }
    var k = (e.key && e.key.length === 1) ? e.key.toLowerCase() : e.key;
    if (k === KONAMI[kpos]) {
      kpos++;
      if (kpos === KONAMI.length) { kpos = 0; creative(); }
    } else {
      kpos = (k === KONAMI[0]) ? 1 : 0;
    }
  });

  /* ---------- 交互：点击挖方块 / 点开作品 ---------- */
  var clicks = 0;
  document.addEventListener('mousemove', function (e) { mx = e.clientX; }, { passive: true });
  document.addEventListener('touchstart', function () {
    var c = ac(); if (c && c.state === 'suspended') { try { c.resume(); } catch (e) {} }
  }, { passive: true });
  document.addEventListener('click', function (e) {
    var c = ac(); if (c && c.state === 'suspended') { try { c.resume(); } catch (e) {} }
    var t = e.target;
    if (t && t.closest && t.closest('a,button,#egg-hint,#egg-mus,.egg-ach')) {
      if (t.closest('a,button,[data-bvid],.card,.work-card')) ach('play', '鉴赏家 —— 点开了作品', '📺');
      return;
    }
    sfxDig();
    digFx(e.clientX, e.clientY);
    clicks++;
    if (clicks === 15) ach('dig', '破坏方块达人 —— 连挖 15 下', '⛏️');
  }, true);

  /* ---------- 首次见面 + 翻到作品区 ---------- */
  setTimeout(function () { ach('first', '初次见面 —— 欢迎来到方块世界', '🟩'); }, 2200);
  (function watchWorks() {
    var el = document.getElementById('works') || document.querySelector('section');
    if (!el) return;
    var fired = false;
    function check() {
      if (fired) return;
      var r = el.getBoundingClientRect();
      if (r.top < (window.innerHeight || 0) * 0.85) {
        fired = true;
        ach('works', '旅行者 —— 翻到了作品区', '🗺️');
        window.removeEventListener('scroll', check);
      }
    }
    window.addEventListener('scroll', check, { passive: true });
    setTimeout(check, 800);
  })();

  /* ---------- 提示条 ---------- */
  var hint = document.getElementById('egg-hint');
  if (hint) {
    hint.addEventListener('click', function () { setF3(); });
    hint.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setF3(); }
    });
    setTimeout(function () { hint.style.opacity = '.24'; }, 15000);
  }

  window.xyAch = ach;
  window.xySfx = { dig: sfxDig, get: sfxGet, gem: sfxGem, pop: function () { tone(1046, 0, 0.12, 0.1, 'square'); } };
  window.xyAC = ac;
  try {
    console.log('%c⛏ xiao小小阳 · 方块世界', 'background:#3c8527;color:#fff;padding:4px 8px;font-weight:700');
    console.log('%c彩蛋：↑↑↓↓←→←→BA  或按 F3', 'color:#fcfc54');
    console.log('%c/execute as @s run say 你好，冒险者', 'color:#7fd1ff');
  } catch (e) {}
})();
</script>
<!-- FUN-EGG-END -->
<!-- FUN-MUSIC-START -->
<style>
#egg-mus{position:fixed;right:14px;bottom:14px;z-index:62;width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;font-size:18px;line-height:1;cursor:pointer;user-select:none;
  border:2px solid rgba(255,255,255,.35);background:rgba(12,20,30,.5);color:#eaf6ff;
  opacity:.62;transition:opacity .3s,transform .25s,background .3s,border-color .3s;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#egg-mus:hover,#egg-mus:active{opacity:1;transform:scale(1.07)}
#egg-mus.on{opacity:1;border-color:#8ef07a;color:#c8ffc0;background:rgba(12,20,30,.8)}
#egg-mus.tip::after{content:"点我听背景音乐";position:absolute;right:52px;top:50%;transform:translateY(-50%);
  white-space:nowrap;font-size:11px;padding:4px 9px;border-radius:999px;color:#eaf6ff;
  background:rgba(12,20,30,.72);opacity:0;animation:musTip 6s ease-out 2.5s 1 forwards}
@keyframes musTip{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
@media (max-width:520px){#egg-mus{width:40px;height:40px}}
@media (prefers-reduced-motion:reduce){.egg-bit,.egg-gem,.egg-tip{display:none}}
</style>
<span id="egg-mus" role="button" tabindex="0" title="背景音乐（C418 风格，点击开/关）" aria-label="背景音乐">🔇</span>
<script>
(function () {
  var btn = document.getElementById('egg-mus');
  var MUS = { on: false, timer: 0, master: null, gate: null, conv: null };
  /* A 小调五声音阶 —— C418 那种稀疏、随机的钢琴感 */
  var SCALE = [220.00, 261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99];

  function ac() { return window.xyAC ? window.xyAC() : null; }

  function build() {
    var c = ac(); if (!c) return null;
    if (MUS.gate) return c;
    var master = c.createGain();
    master.gain.value = 0.0;
    master.connect(c.destination);
    /* 用噪声脉冲响应做一个廉价混响，营造洞穴空间感 */
    var conv = c.createConvolver();
    var len = Math.floor(c.sampleRate * 2.8);
    var imp = c.createBuffer(2, len, c.sampleRate);
    for (var ch = 0; ch < 2; ch++) {
      var d = imp.getChannelData(ch);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8);
    }
    conv.buffer = imp;
    var wet = c.createGain(); wet.gain.value = 0.5;
    var gate = c.createGain(); gate.gain.value = 1;
    gate.connect(master);
    gate.connect(conv); conv.connect(wet); wet.connect(master);
    MUS.gate = gate; MUS.master = master; MUS.conv = conv;
    return c;
  }

  function note(freq, delay, dur, vol) {
    var c = ac(); if (!c || !MUS.gate) return;
    var t = c.currentTime + delay;
    var o = c.createOscillator(); o.type = 'triangle'; o.frequency.value = freq;
    var o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2.005;
    var g = c.createGain(), g2 = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(vol * 0.22, t + 0.01);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.55);
    o.connect(g); o2.connect(g2); g.connect(MUS.gate); g2.connect(MUS.gate);
    o.start(t); o.stop(t + dur + 0.1); o2.start(t); o2.stop(t + dur * 0.6 + 0.1);
  }

  function step() {
    if (!MUS.on) return;
    if (Math.random() < 0.18) note(SCALE[Math.floor(Math.random() * 3)] / 2, 0, 4.5, 0.05);
    note(SCALE[Math.floor(Math.random() * SCALE.length)], 0, 2.4 + Math.random() * 1.6, 0.075);
    if (Math.random() < 0.35) note(SCALE[Math.floor(Math.random() * SCALE.length)], 0.9, 1.8, 0.05);
    MUS.timer = setTimeout(step, 2200 + Math.random() * 4200);
  }

  function paint() {
    if (!btn) return;
    btn.textContent = MUS.on ? '🎵' : '🔇';
    btn.className = MUS.on ? 'on' : '';
    btn.setAttribute('title', MUS.on ? '背景音乐：开（点击关闭）' : '背景音乐：关（点击开启）');
  }

  function toggle(on) {
    var c = ac(); if (!c) return false;
    if (!MUS.gate && !build()) return false;
    if (c.state === 'suspended') { try { c.resume(); } catch (e) {} }
    MUS.on = (typeof on === 'boolean') ? on : !MUS.on;
    try {
      MUS.master.gain.cancelScheduledValues(c.currentTime);
      MUS.master.gain.setTargetAtTime(MUS.on ? 0.9 : 0.0, c.currentTime, 0.7);
    } catch (e) {}
    if (MUS.on) {
      if (window.xyAch) window.xyAch('musician', '音乐家 —— 打开了背景音乐', '🎵');
      if (!MUS.timer) step();
    } else {
      clearTimeout(MUS.timer); MUS.timer = 0;
    }
    try { localStorage.setItem('xy_music', MUS.on ? '1' : '0'); } catch (e) {}
    paint();
    return MUS.on;
  }

  if (btn) {
    if (localStorage.getItem('xy_music') === '0') { /* 上次关着，保持默认 */ }
    btn.addEventListener('click', function (e) { e.stopPropagation(); toggle(); });
    btn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
    var silent = false;
    try { silent = localStorage.getItem('xy_music') === '0'; } catch (e) {}
    if (!silent) {
      btn.className = 'tip';
      setTimeout(function () { if (!MUS.on) btn.className = ''; }, 9000);
    }
  }

  /* 上次开着的话，用户第一次交互时自动续上 */
  var want = false;
  try { want = localStorage.getItem('xy_music') === '1'; } catch (e) {}
  if (want) {
    var kick = function (e) {
      if (e && e.target === btn) return;
      if (toggle(true)) {
        document.removeEventListener('click', kick, true);
        document.removeEventListener('touchstart', kick, true);
      }
    };
    document.addEventListener('click', kick, true);
    document.addEventListener('touchstart', kick, true);
  }

  window.xyMusic = { toggle: toggle, on: function () { return MUS.on; } };
})();
</script>
<!-- FUN-MUSIC-END -->
</body>
